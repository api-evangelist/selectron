source: live GET probes of /.well-known/* on every Selectron host named in apis.yml
note: >-
  Every /.well-known/ path probed returned 404 on both Selectron hosts, so NO WellKnown
  and NO SecurityTxt pointer is emitted in apis.yml — this file records a verified
  absence, not a presence. On www.selectron.ch the 404 responses for JSON paths are
  served as the Angular site shell (content-type text/html, ~113KB), which is a
  single-page-app catch-all and not a document; /.well-known/security.txt and
  /llms.txt return a true 404 with content-length 0. Selectron does publish a product
  security reporting address on its cybersecurity services page — captured in
  security/selectron-vulnerability-disclosure.yml — but does not expose it via RFC 9116.
